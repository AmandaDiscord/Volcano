name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install, Compile, and create build info for server
        run: |
          corepack enable
          rm ./.yarnrc.yml
          mv ./.yarnrc.nopath.yml ./.yarnrc.yml
          yarn set version 3.3.0
          yarn install
          yarn build
          npm --prefix ./packages/server run create-release
          npm pkg delete packageManager

      - uses: actions/upload-artifact@v7
        with:
          name: server-artifact
          path: |
            package.json
            packages/server/dist/
            packages/server/scripts/
            packages/server/plugins
            LICENSE
            packages/server/package.json
            packages/server/plugin-manifest.json
            packages/encoding/index.js
            packages/encoding/index.d.ts
            packages/encoding/package.json
            packages/encoding/LICENSE
            packages/sdk/index.js
            packages/sdk/package.json
            PLUGINS.md
            PUBLIC_SERVERS.md
            README.md

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifact
          path: |
            package.json
            packages/sdk/index.d.ts
            packages/sdk/index.js
            packages/sdk/package.json
            packages/sdk/README.md
            packages/sdk/server-dts/
            packages/sdk/types.d.ts
